<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Desafio</title>
</head>
<style>
    body{

        font-family: Arial, Helvetica, sans-serif;
    }
    
    th, td{
        border: 2px solid black;
        padding: 10px;
        border-radius: 5px;
    }
    .cabecalho{

        background-color: grey;
    }
    col.cazul{
        background-color: lightblue;
    }
    col.cvermelho{

        background-color: lightcoral;
    }
    col.cverde{

        background-color: lightgreen;
    }
</style>
<body>
    <table>
        <colgroup>
        <col class="cazul">
        <col class="cvermelho">
        <col class="cverde" span="3">
        <col>
        <col>
    
    </colgroup>

        <thead>
           
                
                    <tr class="cabecalho">
                        <th rowspan="2" scope="col">Area</th>
                        <th rowspan="2" scope="col">Disciplinas</th>
                        <th colspan="2" scope="colgroup">Notas</th>
                        <th rowspan="2" scope="col">Média</th>
                    </tr>
                    <tr class="cabecalho">
                        <th scope="col">Nota 1</th>
                        <th scope="col">Nota 2</th>
                    </tr>
                    
                
            
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
            
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
            
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
            
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="
                cabecalho">Média de Exatas</th>
                <td class="
                cabecalho">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="
                cabecalho">Média de Humanas</th>
                <td class="
                cabecalho">0.0</td>
            </tr>
        </tbody>









    </table>
    
</body>
</html>
